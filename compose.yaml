services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bibas
      POSTGRES_USER: bibas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibas -d bibas"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: bibas
      POSTGRES_USER: bibas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set hostname}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set HTTPS origin}
      TRUST_PROXY_HTTPS: ${TRUST_PROXY_HTTPS:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
