{% if page.has_other_pages %}<nav class="pagination">{% if page.has_previous %}<a href="?q={{ query|urlencode }}&status={{ status|urlencode }}&overdue={{ request.GET.overdue|urlencode }}&page={{ page.previous_page_number }}">← Назад</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?q={{ query|urlencode }}&status={{ status|urlencode }}&overdue={{ request.GET.overdue|urlencode }}&page={{ page.next_page_number }}">Далее →</a>{% endif %}</nav>{% endif %}
